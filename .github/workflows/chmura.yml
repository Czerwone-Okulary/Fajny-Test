name: chmura
on: push
jobs:
  main:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update
      - run: sudo apt install texlive-latex-base gnuplot-nox
      - run: gnuplot math
      - run: pdflatex notes.tex
      - uses: actions/upload-artifact@v7
        with:
          path: notes.pdf